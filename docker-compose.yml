services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  storagenode:
    build: .
    volumes:
      - ./data/repo:/data/repo
    environment:
      - STORAGE_BASE_DIR=/data/repo
      - STORAGE_PORT=50051
      - NODE_ADDRESS=storagenode:50051
      - REDIS_HOST=redis
    command: python -u -m docuhub.storagenode.service
    ports:
      - "50051:50051"

  api-server:
    build: .
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: uvicorn docuhub.api.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - storagenode

