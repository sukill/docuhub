[project]
name = "docuhub"
version = "0.1.0"
description = "Distributed Git-based Guideline Repository System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "redis>=7.0.1",
    "ruff>=0.15.4",
]

[project.scripts]
docuhub-api = "docuhub.api.main:run"
docuhub-storagenode = "docuhub.storagenode.service:serve"

[tool.uv]
dev-dependencies = []
